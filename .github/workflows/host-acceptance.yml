name: Seifert host acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: ick
        uses: ./.github/actions/ick-host
      - name: Independent twist geometry tests
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
        run: sh native/test-host.sh
      - id: grease
        uses: isomorphismes/mostow/.github/actions/grease@9c4bfd742f774c9b309df3acce049fc1aa930bf3
      - name: Provision host GLES test inputs
        run: ${{ steps.grease.outputs.executable }} _/provision-host-gl.grease
      - name: Mathematical readouts and real GLES pixel acceptance
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
          SEIFERT_GL_INCLUDE: /usr/include
        run: ${{ steps.grease.outputs.executable }} _/check-live-readouts.grease ${{ github.workspace }}
