name: Seifert host acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: ick
        uses: ./.github/actions/ick-host
      - name: Independent twist geometry tests
        env:
          ICK: ${{ steps.ick.outputs.compiler }}
        run: sh native/test-host.sh

  readouts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: 94dfd99bd3e376507fedc8611053b7173b2519f0
          path: Idric
          persist-credentials: false
      - name: Build the recorded Idriç host compiler
        working-directory: Idric
        env:
          JOBS: '2'
        run: ./edric bootstrap
      - name: Typecheck the actual readout module
        env:
          CHEZ: ${{ github.workspace }}/Idric/.tools/bin/scheme
          IDRIS2_PREFIX: ${{ github.workspace }}/Idric/bootstrap-build
        run: ./Idric/build/exec/idris2 --source-dir types --check types/ArithmeticTopology.idric
      - name: Execute all seventeen host readout check groups
        env:
          CHEZ: ${{ github.workspace }}/Idric/.tools/bin/scheme
          IDRIS2_PREFIX: ${{ github.workspace }}/Idric/bootstrap-build
          IDRIS2_PATH: ${{ github.workspace }}/build/ttc
        run: ./Idric/build/exec/idris2 --source-dir examples/autogenerated/topology-readouts examples/autogenerated/topology-readouts/ReadoutChecks.idric --exec ReadoutChecks.main
