name: Seifert APK artifacts

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "native/**"
      - "icky/**"
      - "ci/**"
      - ".github/actions/ick-host/**"
      - "docs/division-migration.md"
      - ".github/workflows/apk-artifacts.yml"
  pull_request:
    branches: [main, feat/three-block-ribbons]
    paths:
      - "android/**"
      - "native/**"
      - "icky/**"
      - "ci/**"
      - ".github/actions/ick-host/**"
      - "docs/division-migration.md"
      - ".github/workflows/apk-artifacts.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: miro-a1
            abi: armeabi-v7a
          - device: miro-c67
            abi: arm64-v8a

    steps:
      - name: Checkout Seifert
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: host
        uses: ./.github/actions/ick-host

      - name: Checkout canonical Android NDK substrate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/android-NDK
          ref: 42f04d7654d54309ec3f8787bfd2bc40730399d7
          path: deps/android-NDK

      - name: Checkout public development signer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphismes/wegert
          ref: dfa3751f0282cdf6a2083c97063b0e8e996d0d92
          path: deps/wegert

      - name: Install Android inputs
        id: android-inputs
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager=$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "ndk;27.2.12479018" \
            "platforms;android-34" \
            "build-tools;35.0.0"
          printf 'ndk=%s/ndk/27.2.12479018\n' "$sdk_root" >> "$GITHUB_OUTPUT"
          printf 'build-tools=%s/build-tools/35.0.0\n' "$sdk_root" >> "$GITHUB_OUTPUT"

      - id: compiler
        uses: isomorphisms/ai-ci/ick-android@015cc7901ae0b3ad262b476f24e129b53c56db95
        with:
          abi: ${{ matrix.abi }}
          ndk: ${{ steps.android-inputs.outputs.ndk }}

      - name: Verify public development signer
        run: |
          bash deps/wegert/_/build/android-signing/verify-test-signing.sh

      - name: Build signed APK
        env:
          ICK_CC: ${{ steps.compiler.outputs.compiler }}
          ANDROID_ABI: ${{ matrix.abi }}
          ANDROID_API: "21"
          ANDROID_NDK_CHECKOUT: ${{ github.workspace }}/deps/android-NDK
          ANDROID_BUILD_TOOLS: ${{ steps.android-inputs.outputs.build-tools }}
          SEIFERT_KEYSTORE: ${{ github.workspace }}/deps/wegert/_/build/app/wegert-debug.keystore
          SEIFERT_KEYSTORE_TYPE: PKCS12
          SEIFERT_KEY_ALIAS: wegert-debug
          SEIFERT_STORE_PASSWORD: wegert-debug
          SEIFERT_KEY_PASSWORD: wegert-debug
          SEIFERT_EXPECTED_CERT_SHA256: de9b1d47c5a65e6d46a204b79dd9ee566b9d3c9832ba81ebc4213d3392e92ff9
          SEIFERT_TARGET_SDK: "34"
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_HOME="$sdk_root/ndk/27.2.12479018"
          export ANDROID_BUILD_TOOLS="$sdk_root/build-tools/35.0.0"
          output="build/artifacts/seifert-${{ matrix.device }}-${ANDROID_ABI}.apk"
          native="build/artifacts/${ANDROID_ABI}/libseifert.so"
          mkdir -p "$(dirname "$native")" "$(dirname "$output")"
          bash android/build-native.sh "$native"
          bash android/build-apk.sh "$native" "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seifert-${{ matrix.device }}-${{ matrix.abi }}
          if-no-files-found: error
          path: |
            build/artifacts/seifert-${{ matrix.device }}-${{ matrix.abi }}.apk
            build/artifacts/seifert-${{ matrix.device }}-${{ matrix.abi }}.apk.sha256
            build/artifacts/seifert-${{ matrix.device }}-${{ matrix.abi }}.receipt.tsv
